[package]
name    = "cosmic-voice"
version = "0.1.0"
edition = "2024"
description = "Local push-to-talk dictation applet for the COSMIC desktop"
license = "MIT"

[dependencies]
# Errors / logging.
anyhow             = "1"
thiserror          = "2"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async runtime. The engine is a single-threaded event loop; whisper inference
# runs on a blocking thread so it never stalls the applet's UI.
tokio   = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "time", "io-util"] }
futures = { version = "0.3", default-features = false, features = ["std"] }

# Serialisation for the IPC frame format and the on-disk config.
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
ron        = "0.8"

# Direct evdev access. We drive the fd ourselves rather than using the `evdev`
# crate because EVIOCSMASK is the security-relevant part of this program and it
# belongs visibly at the open site, not behind a wrapper.
libc = "0.2"
udev   = "0.9"

# Audio capture as a native PipeWire client, not via cpal.
#
# cpal would reach PipeWire through its pulse/ALSA compatibility layer, which
# lands the capture callback on an ordinary thread in this process. Under heavy
# load that thread is exactly what the scheduler starves, and starving it means
# gaps in the pre-roll ring. A native client's process callback runs on
# PipeWire's own data-loop, which is already SCHED_FIFO at priority 88 and keeps
# being serviced when everything else on the box stops. Costs maybe 100 lines of
# format negotiation over cpal's 10. Worth it here.
pipewire = { version = "0.10", features = ["v0_3_44"] }
libspa   = "0.10"

# Speech recognition and voice activity detection, both from sherpa-onnx.
# CPU on purpose: ONNX Runtime has no Vulkan EP and its ROCm EP needs ORT built
# from source, while a 0.6B int8 transducer runs many times faster than real
# time on 16 Zen 3 cores. The GPU stays free.
#
# NOTE: this crate links statically and, absent SHERPA_ONNX_LIB_DIR, downloads
# a matching prebuilt archive at build time. Vendor or pin that before CI.
sherpa-onnx = "1.13"

# Thread priority for the inference worker. Never run inference on an RT thread:
# a 0.25s compute burst at realtime priority glitches every other audio client
# on the system.
rustix = { version = "1", features = ["process", "fs", "event", "thread"] }

# Wayland text injection. virtual-keyboard is the universal path,
# input-method-v2 the fast path when the focused client speaks text-input-v3.
wayland-client          = "0.31"
wayland-protocols       = { version = "0.32", features = ["client", "unstable", "staging"] }
wayland-protocols-misc  = { version = "0.3", features = ["client"] }
wayland-protocols-wlr   = { version = "0.3", features = ["client"] }
xkbcommon               = "0.8"

# The upstream leg of the input-method multiplexer: a hand-written D-Bus client
# for ibus-daemon's own private bus (see `docs/multiplexer.md`). Nothing on
# crates.io speaks the client side of that protocol — `ibus-rs` was archived in
# 2022 — so the proxies live in `src/ibus`.
#
# The blocking API on purpose: the key path is a synchronous ProcessKeyEvent
# followed by a property read, and the thread that owns it runs calloop, not
# tokio. `blocking-api` is what generates the synchronous proxies.
#
# `async-io` rather than `tokio` as the reactor, which is not a stylistic
# choice: with the tokio feature the connection's internal executor holds a
# tokio socket, so every call into it has to happen inside `zbus::block_on` and
# a timer built in the same future (phase-1 finding 3). async-io's reactor runs
# on a thread of zbus's own, so the blocking proxies work from any plain thread
# — which is what lets the calloop thread call `process_key` directly.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

# The event loop for the input-method thread (`src/im`). One loop over the
# Wayland fd, the IBus signal channel and the key-repeat timer; wayland-client's
# `EventQueue` joins it through `calloop-wayland-source`, which owns the
# read-guard dance that a hand-rolled poll would have to get right.
calloop                = "0.14"
calloop-wayland-source = "0.4"

# zbus's reactor, named here only for its timer: bounding a signal wait needs a
# timer the same executor understands, and `tokio::time` is not it any more.
async-io = "2"

# The candidate window (`src/im/popup.rs`, `src/im/render.rs`). A
# `zwp_input_popup_surface_v2` is a bare `wl_surface`: no toolkit can target it,
# so the pixels are ours to produce, and both crates are picked to unify with
# what libcosmic already drags in rather than to add a second copy of a
# rasteriser.
#
# `tiny-skia` pinned to 0.11 on purpose: 0.12 exists but `iced_tiny_skia` is on
# 0.11.4, and taking 0.12 would compile two of it.
#
# `cosmic-text` because CJK is the entire point. Candidates are Japanese, so the
# renderer needs real shaping and a font fallback chain, not a bitmap blit —
# and cosmic-text is already in the graph via libcosmic's iced, so this costs
# nothing new to build.
tiny-skia   = "0.11"
cosmic-text = "0.19"

# Focused-window app_id, used to pick a per-application vocabulary prompt.
cosmic-client-toolkit = { git = "https://github.com/pop-os/cosmic-protocols", rev = "160b086" }

libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = [
    "applet",
    "tokio",
    "wayland",
] }
cosmic-config = { git = "https://github.com/pop-os/libcosmic" }

[patch."https://github.com/smithay/client-toolkit.git"]
sctk = { package = "smithay-client-toolkit", version = "0.20.0" }

[profile.release]
opt-level = 3
panic     = "abort"
lto       = "thin"
